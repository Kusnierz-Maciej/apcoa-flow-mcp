services:
  apcoa-flow-mcp:
    container_name: apcoa-flow-mcp
    image: ghcr.io/kusnierz-maciej/apcoa-flow-mcp:latest   # or pin a version, e.g. :v1.0.0
    ports:
      - "9012:8080"
    env_file:
      # Secrets live here (credentials + API key). See .env.example.
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Non-secret settings — all overridable via env (Section__Key convention).
      # Defaults shown; uncomment to change.
      #- ApcoaFlow__MaxSessionCostPln=100
      #- ApcoaFlow__CurrentLocationRadiusMeters=300
      # MCP prompts (user-picked shortcuts like "Park here for free"); false = advertise none.
      #- Prompts__Enabled=true
      # Client-side rate limit on APCOA calls (login included): a burst, then one call per period.
      #- RateLimit__TokenLimit=10
      #- RateLimit__ReplenishmentPeriod=00:00:01

      # Security — require an allowlisted MCP API key (set false to drop the key gate; APCOA
      # credentials are still required). When true, at least one Security__AllowedApiKeys__N must be set.
      #- Security__RequireMcpApiKey=true
      # OAuth lifetimes: code = one-time code from a successful sign-in until the client swaps it for tokens
      # (not the time to fill in the form); access = per-call token, renewed silently; refresh = how long a
      # client may stay idle before signing in again.
      #- OAuth__AuthorizationCodeLifetime=00:01:00
      #- OAuth__AccessTokenLifetime=01:00:00
      #- OAuth__RefreshTokenLifetime=365.00:00:00

      # Logging — human-readable single-line console (good for `docker logs` on the NAS).
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics=Information   # request start/finish + status + ms
      - Logging__LogLevel__System.Net.Http.HttpClient=Information               # each APCOA call: status + ms
      - Logging__LogLevel__ModelContextProtocol=Information                     # each MCP method + tool result
      - Logging__Console__FormatterName=simple
      - Logging__Console__FormatterOptions__SingleLine=true
      - Logging__Console__FormatterOptions__IncludeScopes=true

      # Telemetry — off by default; set true to export to the logging stack's Alloy receiver
      # (and uncomment the `networks:` blocks below).
      #- Telemetry__Enabled=false
      #- Telemetry__OtlpEndpoint=http://alloy:4317
    restart: unless-stopped
    # With telemetry on, join the observability stack's shared network so `alloy` resolves
    # (uncomment this and the top-level `networks:` block at the end of the file).
    #networks:
    #  - default
    #  - observability

# Shared network created by the observability stack (Alloy/Loki/Tempo/Grafana) — start that stack first.
#networks:
#  observability:
#    external: true
