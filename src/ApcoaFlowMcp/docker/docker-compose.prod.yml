services:
  apcoa-flow-mcp:
    container_name: apcoa-flow-mcp
    image: ghcr.io/kusnierz-maciej/apcoa-flow-mcp:latest
    ports:
      - "9012:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - apcoa-parking-data:/data/parking
    restart: unless-stopped

volumes:
  apcoa-parking-data:
