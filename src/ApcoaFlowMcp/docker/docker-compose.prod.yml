services:
  apcoa-flow-mcp:
    container_name: apcoa-flow-mcp
    image: ghcr.io/kusnierz-maciej/apcoa-flow-mcp:latest   # or pin a version, e.g. :v1.0.0
    ports:
      - "9012:8080"
    env_file:
      # Secrets live here (credentials + API key). See .env.example.
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Non-secret settings — all overridable via env (Section__Key convention).
      # Defaults shown; uncomment to change.
      #- ApcoaFlow__MaxSessionCostPln=100
      #- ApcoaFlow__CurrentLocationRadiusMeters=300
      #- ParkingData__CompanyId=9
      #- ParkingData__GeohashPrecision=6
      #- ParkingData__SoftRefreshAge=12:00:00
      #- ParkingData__HardRefreshAge=48:00:00
      #- ParkingData__BackgroundRefreshInterval=24:00:00
      # StorePath must match the bind mount target below.
      - ParkingData__StorePath=/data/parking
      # Logging
      #- Logging__LogLevel__Default=Information
      #- Logging__LogLevel__Microsoft.AspNetCore=Warning
      #- Logging__LogLevel__System.Net.Http.HttpClient=Warning
      #- Logging__LogLevel__ModelContextProtocol=Warning
      #- Logging__Console__FormatterName=simple
      #- Logging__Console__FormatterOptions__SingleLine=true
      #- Logging__Console__FormatterOptions__IncludeScopes=true
      # Telemetry
      #- Telemetry__Enabled=false
      #- Telemetry__OtlpEndpoint=http://alloy:4317
    volumes:
      # Bind mount to a host directory the container can write to, so the parking snapshot
      # warm-starts after a restart. If it isn't writable the server still runs — it just
      # serves the dataset from memory and re-downloads it on each restart.
      - ./data/parking:/data/parking
    restart: unless-stopped
